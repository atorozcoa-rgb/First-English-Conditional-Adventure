 return <div><h2 className="text-2xl font-extrabold mb-2">Find each If-part and its result</h2><div className="grid grid-cols-3 md:grid-cols-4 gap-2">{cs.map((c,k)=>{const sh=f.includes(k)||m.includes(k);return <motion.button key={k} animate={{rotateY:sh?0:180}} onClick={()=>flip(k)} className={`min-h-[88px] rounded-xl border-4 p-1 text-sm font-bold ${m.includes(k)?'bg-green-200 border-green-700 text-indigo-950':sh?'bg-amber-100 border-amber-500 text-indigo-950':'bg-indigo-600 border-indigo-900 text-2xl'}`}>{sh?c.t:'❓'}</motion.button>})}</div></div>}

function Wheel({go}){
 const PZ=[{l:'⭐ Double points!',m:2},{l:'🪙 +20 bonus coins!',c:20},{l:'🎯 Normal question',m:1},{l:'🚀 +15 bonus points!',b:15}],[rot,setRot]=useState(0),[z,setZ]=useState(null);
 const spin=()=>{if(z||rot)return;sfx.click();const k=Math.random()*4|0;setRot(360*5+360-(k*90+45));setTimeout(()=>{setZ(PZ[k]);sfx.ach();setTimeout(()=>go(PZ[k]),1300)},3100)};
 return <div className="text-center"><h2 className="text-2xl font-extrabold">🎡 Spin the Wheel Challenge</h2><div className="text-3xl -mb-5 relative z-10">🔻</div>
 <div className="w-56 h-56 mx-auto rounded-full border-8 border-white shadow-2xl" style={{background:'conic-gradient(#f59e0b 0 25%,#22c55e 0 50%,#3b82f6 0 75%,#ec4899 0)',transform:`rotate(${rot}deg)`,transition:'transform 3s cubic-bezier(.15,.7,.2,1)'}}/>
 <Btn onClick={spin} disabled={!!rot}>🎡 Spin!</Btn><p className="text-2xl font-extrabold">{z&&z.l}</p></div>}

function Play({init,test,narr,add,onEnd}){
 const [steps,setSteps]=useState(init),[i,setI]=useState(0),[res,setRes]=useState(null),[key,setKey]=useState(0),R=useRef({miss:0,right:0,tr:0}),s=steps[i];
 useEffect(()=>{if(narr&&s.k!='wheel')say(s.t||(s.k=='build'?'Build the sentence in the correct order.':s.tag))},[i,key,narr]);
 const done=(ok,st,ans)=>{const r=R.current;let pts=0;if(ok){pts=r.tr?0:(10+(st.b||0)+(st.tl||0))*(st.m||1);add(pts,r.tr?0:5+(st.c||0));if(!r.tr)r.right++;sfx.ok();burst('⭐')}else{r.miss++;sfx.bad()}setRes({ok,w:st.w,ans,pts,msg:pick(PR)})};
 const next=()=>{R.current.tr=0;setRes(null);i+1>=steps.length?onEnd(R.current):setI(i+1)};
 const body=s.k=='mc'?<MC s={s} done={done}/>:s.k=='build'?<Build s={s} done={done}/>:s.k=='match'?<Match done={done} miss={()=>{R.current.miss++;sfx.bad()}}/>:s.k=='mem'?<Mem done={done} miss={()=>{R.current.miss++;sfx.bad()}}/>:<Wheel go={z=>setSteps(p=>p.map((x,j)=>j==i?{...mq(Math.random()*POOL.length|0,'Spin the Wheel: '+z.l),m:z.m,c:z.c,b:z.b}:x))}/>;
 return <Cd className="max-w-3xl mx-auto"><div className="font-bold">{test?'Question':'Step'} {i+1}/{steps.length} · {s.tag}</div>
 <div className="h-2 bg-indigo-200 rounded my-2 overflow-hidden"><motion.div className="h-full bg-violet-600" style={{width:`${i/steps.length*100}%`}} animate={{width:`${i/steps.length*100}%`}}/></div>
 <AnimatePresence mode="wait"><motion.div key={`${i}-${key}-${s.k}`} initial={{opacity:0,x:40}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-40}}>{body}</motion.div></AnimatePresence>
 <AnimatePresence>{res&&<motion.div initial={{opacity:0,y:20,scale:.9}} animate={{opacity:1,y:0,scale:1}} className="mt-4">
 {res.ok?<div className="rounded-2xl bg-green-100 text-green-900 p-4 font-extrabold text-xl">✅ {res.msg} {res.pts?`+${res.pts} points`:''}</div>
 :<div className="rounded-2xl bg-red-100 text-red-900 p-4 font-extrabold">💡 Not yet! {res.w}<br/>Correct answer: {res.ans}</div>}
 {!res.ok&&!test&&<Btn v onClick={()=>{R.current.tr=1;setRes(null);setKey(k=>k+1)}}>↻ Try again</Btn>}<Btn onClick={next}>{res.ok?'Next ➜':'Continue ➜'}</Btn></motion.div>}</AnimatePresence></Cd>}

const Tut=()=>{const [a,setA]=useState(null),[b,setB]=useState(null),f=(x,set)=>{const [t,ok]=x.split('|');set({t,ok:+ok});+ok?sfx.ok():sfx.bad()};
 const row=(L,set)=><div className="flex flex-wrap gap-2 my-2">{L.map(x=><Btn v key={x} onClick={()=>f(x,set)}>{x.split('|')[0]}</Btn>)}</div>;
 return <div><h2 className="text-2xl font-extrabold">Mini Tutorial</h2><p className="text-2xl">If students <b>{a?a.t:'___'}</b> hard, they <b>{b?b.t:'___'}</b> the exam.</p>{row(['study|1','will study|0','studied|0'],setA)}{a&&<p>{a.ok?'✅ Correct! Present Simple after If.':'❌ Try again: use Present Simple after If.'}</p>}{row(['pass|0','will pass|1','passed|0'],setB)}{b&&<p>{b.ok?'✅ Correct! will + base verb.':'❌ Try again: use will + base verb after the comma.'}</p>}</div>};

function App(){

 const add=(p,c)=>setS(s=>({...s,pts:s.pts+p,coins:s.coins+c})),go=x=>{sfx.click();setSc(x)},tm=()=>mus(),un=i=>i==0||S.done.includes(i-1);
 const play=li=>{setCtx({li,init:LV[li].s()});setSc('play')},startTest=()=>{setCtx({test:1,init:shuf(POOL).slice(0,10).map(p=>({k:'mc',tag:'Final Assessment',...p}))});setSc('play')};

 else{const li=ctx.li,st=R.miss==0?3:R.miss<3?2:1,b={0:0,2:1,3:2}[li],nb=b!=null&&!S.badges.includes(BD[b][1])?BD[b]:null;setS(s=>({...s,stars:s.stars+st,done:s.done.includes(li)?s.done:[...s.done,li],badges:nb?[...s.badges,nb[1]]:s.badges}));setRes({li,st,nb});burst('🎉')}sfx.win();setSc('end')};

 <Cd className="mt-4 text-left"><h2 className="text-2xl font-extrabold">ℹ️ About</h2><p>A self-guided A2 game: 5 levels and a final test. Turn on 🎙 to hear every question read aloud, and 🎵 for music.</p></Cd></div>;
 if(sc=='learn')v=<div><div className="flex flex-wrap gap-2 justify-center mb-3">{['Grammar','Examples','Try it','Listening'].map((n,i)=><button key={n} onClick={()=>setTab(i)} className={`px-5 min-h-[52px] rounded-2xl font-extrabold ${tab==i?'bg-violet-600 text-white':'bg-indigo-100 text-indigo-950'}`}>{n}</button>)}</div>
 <Cd key={tab} className="max-w-3xl mx-auto">{tab==0&&<div><h2 className="text-3xl font-extrabold">Learn the First Conditional</h2><p className="text-xl">We use it for <b>real future situations</b>: things that can happen.</p><p className="text-xl my-3"><span className="px-3 py-1 rounded-xl bg-blue-600 text-white">If + Present Simple</span> , <span className="px-3 py-1 rounded-xl bg-orange-700 text-white">will + base verb</span></p><p className="text-xl"><Ex e={EX[0]}/> <Spk t={sOf(0)}/></p><ul className="list-disc pl-6 mt-3"><li>Use a comma when the If part is first.</li><li>Negative: will not or won't.</li><li>Do NOT use will after If: ❌ If I will study…</li></ul></div>}
 {tab==1&&<div><h2 className="text-3xl font-extrabold mb-2">10 Examples</h2>{EX.map((e,i)=><p key={i}>{i+1}. <Ex e={e}/> <Spk t={sOf(i)}/></p>)}</div>}
 {tab==2&&<Tut/>}{tab==3&&<div><h2 className="text-3xl font-extrabold">Listening Practice</h2><p>Listen and repeat.</p><Btn v onClick={()=>say(EX.map((e,i)=>sOf(i)).join(' '))}>🔁 Replay all</Btn>{EX.slice(0,5).map((e,i)=><p key={i}><Spk t={sOf(i)}/> {sOf(i)}</p>)}</div>}</Cd>
 <div className="text-center"><Btn onClick={()=>go('map')}>🎮 Play the game</Btn><Btn v onClick={()=>go('home')}>🏠 Home</Btn></div></div>;
 if(sc=='map')v=<div className="max-w-3xl mx-auto"><h2 className="t3d text-3xl font-black text-center mb-3">The Future Teacher Challenge</h2><div className="grid gap-3">{LV.map((l,i)=><Cd key={i} style={{opacity:un(i)?1:.55}} className="flex items-center gap-4"><span className="text-5xl">{un(i)?l.e:'🔒'}</span><div className="flex-1"><h3 className="text-xl font-extrabold">{i==4?'Final Level':'Level '+(i+1)}: {l.n}</h3><p>{l.d}</p>{S.done.includes(i)&&<b className="text-green-600">✔ Completed</b>}</div><Btn disabled={!un(i)} onClick={()=>play(i)}>{S.done.includes(i)?'Replay':'Play'}</Btn></Cd>)}
 <Cd className="flex items-center gap-4" style={{opacity:S.done.length>4?1:.55}}><span className="text-5xl">📝</span><div className="flex-1"><h3 className="text-xl font-extrabold">Final Assessment</h3><p>10 random easy questions. Score 80%+ for the Master Teacher Badge!</p></div><Btn disabled={S.done.length<5} onClick={startTest}>Start</Btn></Cd></div>

 :<><h1 className="text-3xl font-black">🎉 Level complete!</h1><p className="text-xl">{LV[res.li].n}</p><motion.div initial={{scale:0,rotate:-90}} animate={{scale:1,rotate:0}} transition={{type:'spring'}} className="text-5xl">{'⭐'.repeat(res.st)}</motion.div>{res.nb&&<motion.div initial={{scale:0}} animate={{scale:1}} className="inline-block m-2 px-4 py-2 rounded-2xl bg-amber-200 text-amber-900 font-bold">{res.nb[0]} New badge: {res.nb[1]}!</motion.div>}<p>Total score: <b>{S.pts}</b> · 🪙 {S.coins}</p></>}<Btn v onClick={()=>go('map')}>🗺 Back to map</Btn></Cd>;

 <div className="text-center noprint"><Btn onClick={()=>print()}>🖨 Print / Save PDF</Btn><Btn v onClick={()=>go('map')}>🗺 Map</Btn><Btn v onClick={()=>{if(confirm('Play again from the start?')){setS({pts:0,coins:0,stars:0,done:[],badges:[],fin:null});go('home')}}}>↻ Replay</Btn></div></div>;

 <AnimatePresence mode="wait"><motion.main key={sc} initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-20}} className="max-w-4xl mx-auto p-4">{v}</motion.main></AnimatePresence></>}
